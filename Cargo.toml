[package]
authors = ["Hirokazu Nakanishi <nakanisi.hirokazu@jp.panasonic.com>"]
name = "fft-analyzer"
edition = "2024"
version = "0.1.0"


[lib]
harness = false

# needed for each integration test
[[test]]
name = "integration"
harness = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
semihosting = "0.1.20"
stm32h7xx-hal = { version = "0.16.0", features = ["stm32h753", "rt"] }
libm = "0.2"
micromath = "2.1.0"

[dev-dependencies]
defmt-test = "0.3"

# cargo build/run
[profile.dev]
opt-level = 0
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# default is opt-level = '3', but that makes quite
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across
# crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
debug = 2
